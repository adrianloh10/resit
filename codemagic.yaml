# Cloud build for the Resit Android app (no Mac, no local Node needed).
# Connect this repo in Codemagic; it runs these steps on a cloud machine and
# produces an installable APK. The web app is copied into www/ and wrapped by
# Capacitor; the native android/ project is generated fresh each build.
#
# The launcher icon and splash are PRE-RENDERED and committed in `android-res/`
# (regenerate with `python tools/make-native-assets.py`, then commit). The build
# copies that folder over the generated project's res/ — no image library is
# installed in CI. `icons/` is separate: those are the web PWA's icons, and they
# are what android-res/ is derived from.
#
# Two workflows:
#  - "Resit Android (debug)"          -> sideloadable APK for testing
#  - "Resit Android (release .aab)"   -> signed bundle for Google Play.
#    Prerequisite ONE-TIME step in the Codemagic UI: Team/Personal settings ->
#    Code signing identities -> Android -> generate (or upload) a keystore and
#    name the reference `resit_upload`. BACK THE KEYSTORE UP — losing it means
#    the app can never be updated on Play again.
workflows:
  android:
    name: Resit Android (debug)
    # mac_mini_m2 is covered by Codemagic's 500 free minutes/month;
    # Linux instances are pay-per-minute and NOT in the free tier.
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22 # Capacitor 8 requires Node 20.15+/22+; 22 is the current LTS
      java: 21 # Capacitor 8's Android library compiles against Java 21
    scripts:
      - name: Assemble web app into www/
        script: |
          rm -rf www && mkdir www
          cp index.html app.js db.js ocr.js styles.css version.js manifest.webmanifest www/
          cp eula.html privacy.html www/
          cp -r icons www/icons
          cp -r vendor www/vendor   # self-hosted tesseract.js engine (no CDN)
      - name: Enable LAN networking (debug-only)
        script: |
          # OCR-ENGINE-PLAN.md Phase 3b device bench + general local-dev use.
          # Mutates THIS CI checkout's capacitor.config.json only — never
          # committed back, never touches the android-release workflow below.
          # androidScheme:"http" makes the app's own page load as
          # http://localhost instead of https://localhost, so fetching the
          # LAN bench server (also http://) is same-scheme, not mixed
          # content — sidesteps the WebView mixed-content policy entirely
          # instead of relying on allowMixedContent, which recent WebView/
          # Chromium versions don't reliably honor for fetch()/XHR.
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
            c.android = Object.assign({}, c.android, { allowMixedContent: true });
            c.server = Object.assign({}, c.server, { androidScheme: 'http', cleartext: true });
            fs.writeFileSync('capacitor.config.json', JSON.stringify(c, null, 2));
          "
      - name: Install Capacitor and add Android
        script: |
          npm install
          npx cap add android
          npx cap sync android
          # Debug-only cleartext exception (see step above) — Android 9+
          # blocks plain HTTP by default; the bench's LAN photo/scorer server
          # needs it. android/ is regenerated every build, so this never
          # sticks around as hand-edited source; android-release never runs
          # this sed.
          sed -i '' 's/android:supportsRtl="true"/android:supportsRtl="true" android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
      - name: Play Billing prerequisites (RevenueCat, Phase 18)
        script: |
          # RevenueCat's Capacitor guide: the Activity's launchMode must be
          # "standard" or "singleTop" — Capacitor's template uses "singleTask",
          # and with that, backgrounding the app mid-purchase can CANCEL the
          # purchase. That is the normal case in Malaysia: the Play sheet hands
          # off to a banking app for FPX / 3-D Secure approval. android/ is
          # regenerated every build, so patch the generated manifest here and
          # prove it landed (a silent no-op is how the icon bug shipped).
          M=android/app/src/main/AndroidManifest.xml
          sed -i '' 's/android:launchMode="singleTask"/android:launchMode="singleTop"/' "$M"
          grep -q 'android:launchMode="singleTop"' "$M" || { echo "launchMode patch did not apply - Capacitor's android template changed; check $M"; exit 1; }
          # The com.android.vending.BILLING permission arrives by manifest
          # merger from RevenueCat -> Play Billing Library; Play Console needs
          # a build carrying it before Subscriptions can be created. Prove the
          # plugin is actually wired into this Android project.
          grep -q 'purchases-capacitor' android/capacitor.settings.gradle || { echo "@revenuecat/purchases-capacitor is not in the Android project - was it dropped from package.json?"; exit 1; }
          echo "launchMode=singleTop applied; RevenueCat plugin present (brings the Play Billing permission)."
      - name: Apply the Recap launcher icon + splash
        script: |
          # The launcher icons and splash are pre-rendered and committed in
          # android-res/ (see tools/make-native-assets.py). They used to be
          # generated here by `npx @capacitor/assets generate --android ||
          # echo "skipped icon generation"`, which went wrong twice over:
          #  (a) its source images were never committed, so it failed on every
          #      build and the `||` hid it — the app shipped Capacitor's DEFAULT
          #      blue icon and Google Play REJECTED it ("Misleading Claims ->
          #      app store listing mismatch");
          #  (b) @capacitor/assets pulls in `sharp`, whose native build broke
          #      `npm install` outright on the macOS builder (13 Aug 2026).
          # Copying committed files needs no image library, no download and no
          # compiler, and the bytes can be reviewed before they ship.
          RES=android/app/src/main/res
          test -d android-res || { echo "android-res/ is missing - run tools/make-native-assets.py and commit it"; exit 1; }
          # File-by-file, not `cp -R android-res/. $RES/` — BSD cp nests a
          # source directory INSIDE an existing destination directory of the
          # same name instead of merging into it.
          find android-res -type f | while read -r src; do
            rel="${src#android-res/}"
            mkdir -p "$RES/$(dirname "$rel")"
            cp "$src" "$RES/$rel"
          done
          # Prove it landed. A silent no-op at this exact step is what got the
          # app rejected, so compare bytes rather than trusting the copy.
          for f in mipmap-mdpi/ic_launcher.png mipmap-hdpi/ic_launcher.png \
                   mipmap-xhdpi/ic_launcher.png mipmap-xxhdpi/ic_launcher.png \
                   mipmap-xxxhdpi/ic_launcher.png mipmap-xxxhdpi/ic_launcher_round.png \
                   mipmap-xxxhdpi/ic_launcher_foreground.png \
                   values/ic_launcher_background.xml drawable/splash.png; do
            cmp "android-res/$f" "$RES/$f" || { echo "launcher resource was NOT applied: $f"; exit 1; }
          done
          grep -q '4A2E1B' "$RES/values/ic_launcher_background.xml" || { echo "adaptive-icon background colour was not applied"; exit 1; }
          echo "Recap launcher icon + splash applied to all five densities."
      - name: Verify target API level (Play requires 36+)
        script: |
          # Play blocks updates that target below API 36 from 31 Aug 2026. The
          # value comes from Capacitor's generated variables.gradle, i.e. from
          # the pinned @capacitor/* versions in package.json - assert it here so
          # a dependency change can never quietly drop it again.
          TARGET=$(sed -n 's/.*targetSdkVersion[ =]*\([0-9][0-9]*\).*/\1/p' android/variables.gradle | head -1)
          echo "targetSdkVersion = ${TARGET:-<not found>}"
          [ "${TARGET:-0}" -ge 36 ] || { echo "Play requires target API 36 (Android 16) or higher - bump the @capacitor/* pins in package.json"; exit 1; }
      - name: Build debug APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  android-release:
    name: Resit Android (release .aab)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      android_signing:
        - resit_upload # keystore reference created once in the Codemagic UI
      node: 22
      java: 21
    scripts:
      - name: Assemble web app into www/
        script: |
          rm -rf www && mkdir www
          cp index.html app.js db.js ocr.js styles.css version.js manifest.webmanifest www/
          cp eula.html privacy.html www/
          cp -r icons www/icons
          cp -r vendor www/vendor   # self-hosted tesseract.js engine (no CDN)
      - name: Install Capacitor and add Android
        script: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Play Billing prerequisites (RevenueCat, Phase 18)
        script: |
          # Same as the debug workflow — see the comment there. RevenueCat
          # requires launchMode standard/singleTop (Capacitor's template uses
          # singleTask, which can cancel a purchase when the Play sheet hands
          # off to a banking app for FPX / 3-D Secure), and the Play Billing
          # permission must be in the merged manifest of this .aab for Play
          # Console to unlock the Subscriptions page.
          M=android/app/src/main/AndroidManifest.xml
          sed -i '' 's/android:launchMode="singleTask"/android:launchMode="singleTop"/' "$M"
          grep -q 'android:launchMode="singleTop"' "$M" || { echo "launchMode patch did not apply - Capacitor's android template changed; check $M"; exit 1; }
          grep -q 'purchases-capacitor' android/capacitor.settings.gradle || { echo "@revenuecat/purchases-capacitor is not in the Android project - was it dropped from package.json?"; exit 1; }
          echo "launchMode=singleTop applied; RevenueCat plugin present (brings the Play Billing permission)."
      - name: Apply the Recap launcher icon + splash
        script: |
          # The launcher icons and splash are pre-rendered and committed in
          # android-res/ (see tools/make-native-assets.py). They used to be
          # generated here by `npx @capacitor/assets generate --android ||
          # echo "skipped icon generation"`, which went wrong twice over:
          #  (a) its source images were never committed, so it failed on every
          #      build and the `||` hid it — the app shipped Capacitor's DEFAULT
          #      blue icon and Google Play REJECTED it ("Misleading Claims ->
          #      app store listing mismatch");
          #  (b) @capacitor/assets pulls in `sharp`, whose native build broke
          #      `npm install` outright on the macOS builder (13 Aug 2026).
          # Copying committed files needs no image library, no download and no
          # compiler, and the bytes can be reviewed before they ship.
          RES=android/app/src/main/res
          test -d android-res || { echo "android-res/ is missing - run tools/make-native-assets.py and commit it"; exit 1; }
          # File-by-file, not `cp -R android-res/. $RES/` — BSD cp nests a
          # source directory INSIDE an existing destination directory of the
          # same name instead of merging into it.
          find android-res -type f | while read -r src; do
            rel="${src#android-res/}"
            mkdir -p "$RES/$(dirname "$rel")"
            cp "$src" "$RES/$rel"
          done
          # Prove it landed. A silent no-op at this exact step is what got the
          # app rejected, so compare bytes rather than trusting the copy.
          for f in mipmap-mdpi/ic_launcher.png mipmap-hdpi/ic_launcher.png \
                   mipmap-xhdpi/ic_launcher.png mipmap-xxhdpi/ic_launcher.png \
                   mipmap-xxxhdpi/ic_launcher.png mipmap-xxxhdpi/ic_launcher_round.png \
                   mipmap-xxxhdpi/ic_launcher_foreground.png \
                   values/ic_launcher_background.xml drawable/splash.png; do
            cmp "android-res/$f" "$RES/$f" || { echo "launcher resource was NOT applied: $f"; exit 1; }
          done
          grep -q '4A2E1B' "$RES/values/ic_launcher_background.xml" || { echo "adaptive-icon background colour was not applied"; exit 1; }
          echo "Recap launcher icon + splash applied to all five densities."
      - name: Verify target API level (Play requires 36+)
        script: |
          # Play blocks updates that target below API 36 from 31 Aug 2026. The
          # value comes from Capacitor's generated variables.gradle, i.e. from
          # the pinned @capacitor/* versions in package.json - assert it here so
          # a dependency change can never quietly drop it again.
          TARGET=$(sed -n 's/.*targetSdkVersion[ =]*\([0-9][0-9]*\).*/\1/p' android/variables.gradle | head -1)
          echo "targetSdkVersion = ${TARGET:-<not found>}"
          [ "${TARGET:-0}" -ge 36 ] || { echo "Play requires target API 36 (Android 16) or higher - bump the @capacitor/* pins in package.json"; exit 1; }
      - name: Version + signing config (derived from version.js)
        script: |
          V=$(grep -o '"[0-9][0-9.]*"' version.js | tr -d '"')
          MAJOR=${V%%.*}; REST=${V#*.}; MINOR=${REST%%.*}; PATCH=${REST#*.}
          CODE=$((MAJOR*10000 + MINOR*100 + PATCH))
          echo "versionName $V -> versionCode $CODE"
          sed -i '' "s/versionCode 1$/versionCode $CODE/" android/app/build.gradle
          sed -i '' "s/versionName \"1.0\"/versionName \"$V\"/" android/app/build.gradle
          cat >> android/app/build.gradle <<'EOF'
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
      - name: Build signed release bundle
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
