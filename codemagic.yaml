# Cloud build for the Resit Android app (no Mac, no local Node needed).
# Connect this repo in Codemagic; it runs these steps on a cloud machine and
# produces an installable APK. The web app is copied into www/ and wrapped by
# Capacitor; the native android/ project is generated fresh each build.
#
# The launcher icon and splash come from the committed `assets/` sources
# (icon-only / icon-foreground / icon-background / splash / splash-dark),
# regenerate them with `python tools/make-native-assets.py`. They are NOT the
# same files as `icons/` — those are the web PWA's icons.
#
# Two workflows:
#  - "Resit Android (debug)"          -> sideloadable APK for testing
#  - "Resit Android (release .aab)"   -> signed bundle for Google Play.
#    Prerequisite ONE-TIME step in the Codemagic UI: Team/Personal settings ->
#    Code signing identities -> Android -> generate (or upload) a keystore and
#    name the reference `resit_upload`. BACK THE KEYSTORE UP — losing it means
#    the app can never be updated on Play again.
workflows:
  android:
    name: Resit Android (debug)
    # mac_mini_m2 is covered by Codemagic's 500 free minutes/month;
    # Linux instances are pay-per-minute and NOT in the free tier.
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22 # Capacitor 8 requires Node 20.15+/22+; 22 is the current LTS
      java: 21 # Capacitor 8's Android library compiles against Java 21
    scripts:
      - name: Assemble web app into www/
        script: |
          rm -rf www && mkdir www
          cp index.html app.js db.js ocr.js styles.css version.js manifest.webmanifest www/
          cp eula.html privacy.html www/
          cp -r icons www/icons
          cp -r vendor www/vendor   # self-hosted tesseract.js engine (no CDN)
      - name: Enable LAN networking (debug-only)
        script: |
          # OCR-ENGINE-PLAN.md Phase 3b device bench + general local-dev use.
          # Mutates THIS CI checkout's capacitor.config.json only — never
          # committed back, never touches the android-release workflow below.
          # androidScheme:"http" makes the app's own page load as
          # http://localhost instead of https://localhost, so fetching the
          # LAN bench server (also http://) is same-scheme, not mixed
          # content — sidesteps the WebView mixed-content policy entirely
          # instead of relying on allowMixedContent, which recent WebView/
          # Chromium versions don't reliably honor for fetch()/XHR.
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
            c.android = Object.assign({}, c.android, { allowMixedContent: true });
            c.server = Object.assign({}, c.server, { androidScheme: 'http', cleartext: true });
            fs.writeFileSync('capacitor.config.json', JSON.stringify(c, null, 2));
          "
      - name: Install Capacitor and add Android
        script: |
          npm install
          npx cap add android
          npx cap sync android
          # Debug-only cleartext exception (see step above) — Android 9+
          # blocks plain HTTP by default; the bench's LAN photo/scorer server
          # needs it. android/ is regenerated every build, so this never
          # sticks around as hand-edited source; android-release never runs
          # this sed.
          sed -i '' 's/android:supportsRtl="true"/android:supportsRtl="true" android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
      - name: Generate app icons + splash (must succeed)
        script: |
          # This step used to end in `|| echo "skipped icon generation"` with no
          # assets/ sources in the repo, so it silently no-oped on every build
          # and the app shipped Capacitor's DEFAULT blue launcher icon. Google
          # Play rejected it (Misleading Claims -> "App store listing mismatch":
          # installed icon differs from the store listing). A failure here must
          # now break the build instead of shipping the wrong icon.
          test -f assets/icon-only.png || { echo "assets/ sources are missing - run tools/make-native-assets.py and commit them"; exit 1; }
          # Delete the template's placeholder launcher icons FIRST: if the
          # generator ever writes nothing again, Gradle fails loudly on the
          # missing resource instead of quietly reusing the default icon.
          rm -f android/app/src/main/res/mipmap-*/ic_launcher*.png
          npx @capacitor/assets generate --android
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || { echo "icon generation produced no launcher icons"; exit 1; }
          ls -l android/app/src/main/res/mipmap-xxxhdpi/
      - name: Verify target API level (Play requires 36+)
        script: |
          # Play blocks updates that target below API 36 from 31 Aug 2026. The
          # value comes from Capacitor's generated variables.gradle, i.e. from
          # the pinned @capacitor/* versions in package.json - assert it here so
          # a dependency change can never quietly drop it again.
          TARGET=$(sed -n 's/.*targetSdkVersion[ =]*\([0-9][0-9]*\).*/\1/p' android/variables.gradle | head -1)
          echo "targetSdkVersion = ${TARGET:-<not found>}"
          [ "${TARGET:-0}" -ge 36 ] || { echo "Play requires target API 36 (Android 16) or higher - bump the @capacitor/* pins in package.json"; exit 1; }
      - name: Build debug APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  android-release:
    name: Resit Android (release .aab)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      android_signing:
        - resit_upload # keystore reference created once in the Codemagic UI
      node: 22
      java: 21
    scripts:
      - name: Assemble web app into www/
        script: |
          rm -rf www && mkdir www
          cp index.html app.js db.js ocr.js styles.css version.js manifest.webmanifest www/
          cp eula.html privacy.html www/
          cp -r icons www/icons
          cp -r vendor www/vendor   # self-hosted tesseract.js engine (no CDN)
      - name: Install Capacitor and add Android
        script: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Generate app icons + splash (must succeed)
        script: |
          # This step used to end in `|| echo "skipped icon generation"` with no
          # assets/ sources in the repo, so it silently no-oped on every build
          # and the app shipped Capacitor's DEFAULT blue launcher icon. Google
          # Play rejected it (Misleading Claims -> "App store listing mismatch":
          # installed icon differs from the store listing). A failure here must
          # now break the build instead of shipping the wrong icon.
          test -f assets/icon-only.png || { echo "assets/ sources are missing - run tools/make-native-assets.py and commit them"; exit 1; }
          # Delete the template's placeholder launcher icons FIRST: if the
          # generator ever writes nothing again, Gradle fails loudly on the
          # missing resource instead of quietly reusing the default icon.
          rm -f android/app/src/main/res/mipmap-*/ic_launcher*.png
          npx @capacitor/assets generate --android
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || { echo "icon generation produced no launcher icons"; exit 1; }
          ls -l android/app/src/main/res/mipmap-xxxhdpi/
      - name: Verify target API level (Play requires 36+)
        script: |
          # Play blocks updates that target below API 36 from 31 Aug 2026. The
          # value comes from Capacitor's generated variables.gradle, i.e. from
          # the pinned @capacitor/* versions in package.json - assert it here so
          # a dependency change can never quietly drop it again.
          TARGET=$(sed -n 's/.*targetSdkVersion[ =]*\([0-9][0-9]*\).*/\1/p' android/variables.gradle | head -1)
          echo "targetSdkVersion = ${TARGET:-<not found>}"
          [ "${TARGET:-0}" -ge 36 ] || { echo "Play requires target API 36 (Android 16) or higher - bump the @capacitor/* pins in package.json"; exit 1; }
      - name: Version + signing config (derived from version.js)
        script: |
          V=$(grep -o '"[0-9][0-9.]*"' version.js | tr -d '"')
          MAJOR=${V%%.*}; REST=${V#*.}; MINOR=${REST%%.*}; PATCH=${REST#*.}
          CODE=$((MAJOR*10000 + MINOR*100 + PATCH))
          echo "versionName $V -> versionCode $CODE"
          sed -i '' "s/versionCode 1$/versionCode $CODE/" android/app/build.gradle
          sed -i '' "s/versionName \"1.0\"/versionName \"$V\"/" android/app/build.gradle
          cat >> android/app/build.gradle <<'EOF'
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
      - name: Build signed release bundle
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
