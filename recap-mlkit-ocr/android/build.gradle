// recap-mlkit-ocr — Android library module for the Capacitor plugin.
//
// Deliberately mirrors the official @capacitor/* plugin build.gradle shape:
//  - NO buildscript{} block. This module is included as a SUBPROJECT of the
//    generated `android/` Gradle build (via capacitor.settings.gradle), so it
//    inherits the root project's Android Gradle Plugin off the root buildscript
//    classpath — exactly as android/app/build.gradle does. That keeps us
//    forward-compatible with whatever AGP Capacitor pins, with no version
//    to hand-sync.
//  - SDK levels read from the root project's ext (set in android/variables.gradle
//    by `cap add android`), with fallbacks (matching Capacitor 8's defaults) so
//    the module also builds standalone.
//
// ML Kit Text Recognition v2 is pulled in UNBUNDLED, via Google Play services
// (`play-services-mlkit-text-recognition`, ~+260KB): the model is downloaded by
// Play services on demand, NOT bundled into the APK (that would be the ~4MB
// `com.google.mlkit:text-recognition` artifact — never use it here).
ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.2.1'
    androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? rootProject.ext.androidxEspressoCoreVersion : '3.6.1'
    mlkitTextRecognitionVersion = project.hasProperty('mlkitTextRecognitionVersion') ? rootProject.ext.mlkitTextRecognitionVersion : '19.0.1'
}

apply plugin: 'com.android.library'

android {
    namespace "com.promaxdigita.recap.mlkit"
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation "com.google.android.gms:play-services-mlkit-text-recognition:$mlkitTextRecognitionVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
