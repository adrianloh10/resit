name = "resit"
main = "worker.js"
# build from the cloud/ folder (root directory = cloud)
compatibility_date = "2026-01-01"

# Anonymous per-device daily counter (no personal data). The id is filled in
# after you create the database (DEPLOY.md step 4): `wrangler d1 create resit-quota`.
[[d1_databases]]
binding = "DB"
database_name = "resit-quota"
database_id = "cc890234-c8a9-4a5d-ace5-1d097c7015ed"

[vars]
# Origins allowed to call the reader: web app + native (Capacitor) shells.
ALLOW_ORIGINS = "https://adrianloh10.github.io,http://localhost:8902,https://localhost,http://localhost,capacitor://localhost,ionic://localhost"
# Max receipts one device may read per day via the cloud (protects the free quota).
# Raised 20->30 (Phase 17, Adrian's numbers 29 Jul 2026).
DAILY_CAP = "30"
# Per-device burst guard: at most this many /read attempts per rolling minute,
# independent of the daily cap above (Phase 17).
RATE_LIMIT_PER_MIN = "10"
# Gemini model. flash-lite = cheapest tier. Google's whole 2.5 generation
# (flash + flash-lite) returns 404 "no longer available to new users" for
# this project regardless of the model's own docs-listed shutdown date --
# that date only honors already-grandfathered keys, not ours (created Jun
# 2026). 3.5-flash-lite is Google's current recommended replacement for
# extraction/classification tasks and was verified live working (2026-07-24
# incident, GET /diag/probe). If this ever needs re-diagnosing, use that
# endpoint before guessing a model string again.
GEMINI_MODEL = "gemini-3.5-flash-lite"
# OPTIONAL failover reader: any OpenAI-compatible provider serving an open
# vision model. Set the FALLBACK_API_KEY secret (dashboard -> Settings ->
# Variables and Secrets) to activate — until then these vars are inert.
# Qwen2.5-VL-7B-Instruct (the original pick) is gone from DeepInfra's
# catalog entirely (checked live, 2026-07-24, api.deepinfra.com/v1/openai/
# models) -- Qwen3-VL-30B-A3B-Instruct is its current successor, ~RM0.0015-
# 0.002/scan (input $0.15/M, output $0.60/M tokens). Confirm still listed
# before ever relying on this in an outage: same catalog URL, no auth needed.
FALLBACK_URL = "https://api.deepinfra.com/v1/openai/chat/completions"
FALLBACK_MODEL = "Qwen/Qwen3-VL-30B-A3B-Instruct"

# Secrets are NOT stored here. Set them in the dashboard (Worker -> Settings ->
# Variables and Secrets) or with wrangler:
#   GEMINI_API_KEY     (primary reader)
#   FALLBACK_API_KEY   (optional — activates the failover reader)
#   TURNSTILE_SECRET   (optional bot check)
#   PRO_UNLOCK         (master code for /mint and /revoke)
